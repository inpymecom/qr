<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bar Restaurant Kupula - Mungia</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Epilogue:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #dc3545;
    --red-dark: #b02a37;
    --red-light: #fde8ea;
    --dark: #1a1a1a;
    --mid: #334155;
    --soft: #64748b;
    --line: #e2e8f0;
    --bg: #fdf2f3;
    --white: #ffffff;
    --gold: #d4a017;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Epilogue', sans-serif;
    color: var(--dark);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 60px;
  }

  /* HEADER BAND */
  .header-band {
    width: 100%;
    background: linear-gradient(135deg, #1a1a1a 0%, #4a1015 60%, #dc3545 100%);
    padding: 48px 24px 80px;
    position: relative;
    overflow: hidden;
  }

  .header-band::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }

  .header-band::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -40px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(212,160,23,0.15);
  }

  .dots-pattern {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  .header-content {
    position: relative;
    z-index: 2;
    max-width: 480px;
    margin: 0 auto;
    text-align: center;
  }

  /* AVATAR */
  .avatar-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 18px;
    animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1) both;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    background: linear-gradient(135deg, #dc3545, #b02a37);
  }

  .avatar-badge {
    position: absolute;
    bottom: 2px; right: 2px;
    width: 22px; height: 22px;
    background: #22c55e;
    border: 2px solid white;
    border-radius: 50%;
  }

  .name {
    font-family: 'Syne', sans-serif;
    font-size: 1.7rem;
    font-weight: 800;
    color: white;
    line-height: 1.1;
    margin-bottom: 6px;
    animation: fadeUp 0.5s ease 0.1s both;
  }

  .tagline {
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    font-weight: 400;
    line-height: 1.5;
    animation: fadeUp 0.5s ease 0.2s both;
  }

  /* CARD FLOAT */
  .card-float {
    background: var(--white);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(15,23,42,0.12), 0 4px 16px rgba(15,23,42,0.06);
    width: calc(100% - 40px);
    max-width: 440px;
    margin: -44px auto 0;
    position: relative;
    z-index: 10;
    overflow: hidden;
    animation: slideUp 0.6s ease 0.2s both;
  }

  /* CONTACT ITEMS */
  .contact-list {
    padding: 8px 0;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 24px;
    text-decoration: none;
    color: var(--dark);
    border-bottom: 1px solid var(--line);
    transition: background 0.15s;
    animation: fadeUp 0.4s ease both;
  }

  .contact-item:last-child { border-bottom: none; }
  .contact-item:hover { background: #fdf2f3; }

  .item-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .icon-phone  { background: #fde8ea; }
  .icon-wa     { background: #dcfce7; }
  .icon-email  { background: #fef9c3; }
  .icon-web    { background: #fde8ea; }
  .icon-map    { background: #fce7f3; }

  .item-info { flex: 1; min-width: 0; }

  .item-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--soft);
    margin-bottom: 2px;
  }

  .item-value {
    font-size: 14px;
    font-weight: 500;
    color: var(--dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-arrow {
    color: var(--line);
    font-size: 16px;
    flex-shrink: 0;
  }

  /* CTA BUTTON */
  .cta-btn {
    display: block;
    width: calc(100% - 40px);
    max-width: 440px;
    margin: 16px auto 0;
    padding: 18px;
    background: linear-gradient(135deg, #dc3545, #b02a37);
    border: none;
    border-radius: 14px;
    color: white;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.15s;
    box-shadow: 0 4px 20px rgba(220,53,69,0.35);
    animation: fadeUp 0.5s ease 0.35s both;
  }

  .cta-btn:hover { opacity: 0.92; transform: translateY(-1px); }
  .cta-btn:active { transform: translateY(0); }

  /* SAVE VCARD */
  .save-btn {
    display: block;
    width: calc(100% - 40px);
    max-width: 440px;
    margin: 10px auto 0;
    padding: 12px;
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    color: var(--mid);
    font-family: 'Epilogue', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: all 0.2s;
    animation: fadeUp 0.5s ease 0.4s both;
  }

  .save-btn:hover { border-color: #dc3545; color: #dc3545; background: #fde8ea; }

  /* FOOTER */
  .footer {
    margin-top: 28px;
    text-align: center;
    font-size: 11px;
    color: var(--soft);
    opacity: 0.7;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="header-band">
  <div class="dots-pattern"></div>
  <div class="header-content">
    <div class="avatar-wrap">
      <div class="avatar">🍽️</div>
      <div class="avatar-badge"></div>
    </div>
    <div class="name">Bar Restaurant Kupula</div>
    <div class="tagline">Menú · Pintxos · Bebidas</div>
  </div>
</div>

<div class="card-float">
  <div class="contact-list" id="contactList"></div>
</div>

<a class="cta-btn" id="mainCta" href="#" target="_blank">
  🍽️ &nbsp;Reservar Mesa
</a>

<a class="save-btn" id="saveVcard" href="#">
  💾 &nbsp;Guardar Contacto
</a>

<div class="footer">Bar Restaurant Kupula · Zubiaga Kalea 3, Mungia</div>

<script>
// ════════════════════════════════════════════════════════════
// DATOS DEL BAR KUPULA
// ════════════════════════════════════════════════════════════
const DATA = {
  nombre:     "Bar Restaurant Kupula",
  tagline:    "Menú · Pintxos · Bebidas",
  telefono:   "+34 946 751 869",
  whatsapp:   "34946751869",
  email:      "barkupula@gmail.com",
  reservas:   "https://forms.gle/3ARWkyJot42vpe768",
  direccion:  "Zubiaga Kalea 3, 48100 Mungia, Bizkaia",
  mapsQuery:  "Bar+Restaurant+Kupula+Mungia",
  
  whatsappMsg: "Hola Kupula, quiero reservar una mesa."
};

function buildPage() {
  // Configurar el botón CTA principal
  document.getElementById('mainCta').href = DATA.reservas;

  // Lista de contacto
  const contacts = [
    { 
      icon: '📞', cls: 'icon-phone', label: 'Teléfono', 
      value: DATA.telefono, 
      href: `tel:${DATA.telefono.replace(/\s+/g, '')}` 
    },
    { 
      icon: '💬', cls: 'icon-wa', label: 'WhatsApp', 
      value: 'Reservar por WhatsApp', 
      href: `https://wa.me/${DATA.whatsapp}?text=${encodeURIComponent(DATA.whatsappMsg)}` 
    },
    { 
      icon: '✉️', cls: 'icon-email', label: 'Email', 
      value: DATA.email, 
      href: `mailto:${DATA.email}` 
    },
    { 
      icon: '🍽️', cls: 'icon-web', label: 'Reservas', 
      value: 'Formulario de reserva', 
      href: DATA.reservas 
    },
    { 
      icon: '📍', cls: 'icon-map', label: 'Dirección', 
      value: 'Zubiaga Kalea 3, Mungia', 
      href: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(DATA.mapsQuery)}` 
    }
  ];

  const list = document.getElementById('contactList');
  contacts.forEach((c, i) => {
    const a = document.createElement('a');
    a.href = c.href;
    a.target = '_blank';
    a.className = 'contact-item';
    a.style.animationDelay = `${0.1 + i * 0.07}s`;
    a.innerHTML = `
      <div class="item-icon ${c.cls}">${c.icon}</div>
      <div class="item-info">
        <div class="item-label">${c.label}</div>
        <div class="item-value">${c.value}</div>
      </div>
      <div class="item-arrow">›</div>`;
    list.appendChild(a);
  });

  // vCard
  const vcard = buildVCard();
  const blob = new Blob([vcard], { type: 'text/vcard' });
  const url = URL.createObjectURL(blob);
  const btn = document.getElementById('saveVcard');
  btn.href = url;
  btn.download = `Kupula-Mungia.vcf`;
}

function buildVCard() {
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `FN:${DATA.nombre}`,
    `TEL;TYPE=VOICE:${DATA.telefono}`,
    `TEL;TYPE=CELL:+${DATA.whatsapp}`,
    `EMAIL:${DATA.email}`,
    `URL:${DATA.reservas}`,
    `ADR;TYPE=WORK:;;${DATA.direccion};;;;`,
    `NOTE:${DATA.tagline}`,
    'END:VCARD'
  ];
  return lines.join('\r\n');
}

buildPage();
</script>
</body>
</html>
